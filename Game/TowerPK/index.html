<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Tháp PK</title><link rel="stylesheet" href="styles.css"/></head><body>
<main class="game-shell"><header class="topbar"><div class="brand">THÁP PK <span>LIVE BATTLE</span></div><div class="round"><small>VÒNG 01</small><strong id="connection-status">DEMO MODE</strong></div></header>
<section class="battle"><div class="team team-build"><p class="team-tag">PHE XÂY</p><h1>Đưa tháp<br/>chạm mây</h1><p class="team-hint">Gift phe Xây<br/>thêm khối</p></div><div class="arena"><div class="sky"><span class="cloud cloud-one"></span><span class="cloud cloud-two"></span><div class="goal">MÂY<br/>THẮNG</div></div><div class="tower-zone"><div id="tower" class="tower"></div><div id="shield" class="shield" hidden></div></div><div class="ground"></div><p id="impact" class="impact" aria-live="polite"></p></div><div class="team team-break"><p class="team-tag">PHE PHÁ</p><h1>Làm tháp<br/>đổ xuống</h1><p class="team-hint">Gift phe Phá<br/>gây rung chấn</p></div></section>
<footer class="control-deck"><div class="score"><span>ĐỘ CAO</span><strong id="height">0</strong><small>/ 12 KHỐI</small></div><div class="status"><span id="status-dot"></span><p id="match-status">Phe nào sẽ chiếm lợi thế?</p></div><div class="demo-controls"><button id="build" class="build" type="button">Xây +1</button><button id="break" class="break" type="button">Phá -1</button><button id="protect" type="button">Khiên</button></div></footer></main><script src="app.js"></script></body></html>
